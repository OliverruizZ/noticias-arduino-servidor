<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Servidor de noticias Arduino</title>
  <style>
    body { margin:0; font:17px/1.6 system-ui,sans-serif; color:#182735; background:#f4f7fa; }
    main { max-width:720px; margin:50px auto; padding:28px; }
    h1 { line-height:1.2; }
    button { padding:12px 18px; border:0; border-radius:6px; background:#185b83; color:white; font:inherit; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    a { color:#185b83; }
    pre { padding:18px; background:white; border:1px solid #d4dce3; white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <p>Proyecto Arduino Uno y ESP-01</p>
    <h1>Prueba del servidor de noticias</h1>
    <p>Esta primera etapa devuelve datos de ejemplo. Todavía no presenta noticias reales.</p>
    <p><a href="/api/estado">Ver estado del servidor</a> · <a href="/api/noticia">Ver respuesta JSON</a> · <a href="/api/noticia?formato=lcd">Ver texto para LCD</a></p>
    <button id="probar">Consultar noticia de prueba</button>
    <p id="estado" role="status" aria-live="polite">Pulsa el botón para comprobar la API.</p>
    <pre id="resultado">Sin consulta.</pre>
  </main>
  <script>
    const boton = document.getElementById('probar');
    boton.addEventListener('click', async () => {
      boton.disabled = true;
      document.getElementById('estado').textContent = 'Consultando...';
      try {
        const respuesta = await fetch('/api/noticia', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
        if (!respuesta.ok) throw new Error('Respuesta HTTP ' + respuesta.status);
        const datos = await respuesta.json();
        if (!datos.ok) throw new Error('La API informó un error.');
        document.getElementById('resultado').textContent = JSON.stringify(datos, null, 2);
        document.getElementById('estado').textContent = 'API disponible. Estos son datos de prueba.';
      } catch (error) {
        document.getElementById('estado').textContent = 'Falló la consulta: ' + error.message;
        document.getElementById('resultado').textContent = 'Revisa el despliegue y sus registros en Vercel.';
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
